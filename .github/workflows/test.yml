name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # Every configurable option of every chart must be reachable from that chart's demo config
      # panel, and every control must name an option the chart actually has. Fails if either drifts.
      - name: Check chart config coverage
        run: yarn workspace @ripl/website check-config-coverage

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build (bundles + emits declarations via tsdown)
        run: yarn build

      - name: Typecheck published declarations
        run: yarn typecheck:dist

      - name: Run tests
        run: yarn test

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: .reports/test-results.xml
          reporter: java-junit

      - name: Coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.ts
          json-summary-path: .reports/coverage/coverage-summary.json
          json-final-path: .reports/coverage/coverage-final.json
