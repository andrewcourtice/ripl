name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # Every option named in a docs example must exist on the chart, and every option the chart has
      # must appear in one of its examples. Fails if either drifts from the code.
      - name: Check chart option docs
        run: yarn workspace @ripl/website check-chart-options

      # Every configurable option of every chart must be reachable from that chart's demo config
      # panel, and every control must name an option the chart actually has. Fails if either drifts.
      - name: Check chart config coverage
        run: yarn workspace @ripl/website check-config-coverage

      # Demo controls belong in the pane's footer, wrapped in a RiplField. The website build is not
      # a lerna package, so without this step the guard would only run on deploy, after merge.
      - name: Check demo controls
        run: yarn workspace @ripl/website check-demo-controls

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build (bundles + emits declarations via tsdown)
        run: yarn build

      - name: Typecheck published declarations
        run: yarn typecheck:dist

      - name: Run tests
        run: yarn test

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: .reports/test-results.xml
          reporter: java-junit

      - name: Coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.ts
          json-summary-path: .reports/coverage/coverage-summary.json
          json-final-path: .reports/coverage/coverage-final.json

  # The canvas↔SVG suites need a real browser: jsdom rasterizes nothing and implements no
  # `SVGGeometryElement`, which is why these findings outlived the audit's unit tests.
  browser:
    name: Browser Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      # Run from the root, where `@playwright/test` is declared: it is not a `@ripl/charts`
      # dependency, so yarn builds no binary shim in that workspace and resolves nothing there.
      - name: Run browser parity suites
        run: yarn playwright test -c packages/charts/test/visual/playwright.config.ts parity.spec.ts hit.spec.ts
